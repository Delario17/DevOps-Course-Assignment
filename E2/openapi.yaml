openapi: 3.1.0
info:
  title: A08-B08 Build Dependency Pipeline Contract
  version: 1.0.0
  description: >-
    Version-bound asynchronous contract for DRAFT, BuildChecker, EChecker,
    and MDFixer jobs. Every input and artifact is bound to a complete commit
    SHA and configuration_id.
servers:
  - url: http://localhost:8080
paths:
  /v1/dockerfile-jobs:
    post:
      operationId: createDraftJob
      summary: Create a DRAFT job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './contracts/create-request.schema.json'
                - type: object
                  required: [job_type]
                  properties:
                    job_type:
                      const: DRAFT
            examples:
              draft:
                externalValue: './examples/valid/draft.request.json'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/full-check-jobs:
    post:
      operationId: createFullCheckJob
      summary: Create a BuildChecker full-check job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './contracts/create-request.schema.json'
                - type: object
                  required: [job_type]
                  properties:
                    job_type:
                      const: FULL_CHECK
            examples:
              fullCheck:
                externalValue: './examples/valid/full-check.request.json'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/incremental-check-jobs:
    post:
      operationId: createIncrementalCheckJob
      summary: Create an EChecker incremental-check job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './contracts/create-request.schema.json'
                - type: object
                  required: [job_type]
                  properties:
                    job_type:
                      const: INCREMENTAL_CHECK
            examples:
              incrementalCheck:
                externalValue: './examples/valid/incremental-check.request.json'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/repair-jobs:
    post:
      operationId: createRepairJob
      summary: Create an MDFixer repair job
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: './contracts/create-request.schema.json'
                - type: object
                  required: [job_type]
                  properties:
                    job_type:
                      const: REPAIR
            examples:
              repair:
                externalValue: './examples/valid/repair.request.json'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableProvenance'
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Query job state and artifact references
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^job-[a-z0-9-]{3,64}$'
      responses:
        '200':
          description: Current job representation
          content:
            application/json:
              schema:
                $ref: './contracts/task.schema.json'
              examples:
                draftSucceeded:
                  externalValue: './examples/valid/draft.succeeded.json'
                draftFailed:
                  externalValue: './examples/valid/draft.failed.json'
                fullCheckSucceeded:
                  externalValue: './examples/valid/full-check.succeeded.json'
                incrementalCheckSucceeded:
                  externalValue: './examples/valid/incremental-check.succeeded.json'
                repairSucceeded:
                  externalValue: './examples/valid/repair.succeeded.json'
                repairFailed:
                  externalValue: './examples/valid/repair.failed.json'
        '404':
          $ref: '#/components/responses/ContractError'
  /v1/artifacts/{artifact_id}/content:
    get:
      operationId: downloadArtifact
      summary: Resolve an artifact URI to its immutable content
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
      responses:
        '200':
          description: Artifact bytes with the media type recorded in the artifact record
          headers:
            ETag:
              schema:
                type: string
              description: SHA-256 digest of the returned bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ContractError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Must equal the idempotency_key field in the request body
  responses:
    AcceptedJob:
      description: The service accepted the job for asynchronous execution
      headers:
        Location:
          schema:
            type: string
          description: Relative URL of the job resource
      content:
        application/json:
          schema:
            allOf:
              - $ref: './contracts/task.schema.json'
              - type: object
                required: [status, output, error]
                properties:
                  status:
                    enum: [QUEUED, RUNNING]
                  output:
                    type: 'null'
                  error:
                    type: 'null'
          examples:
            draftAccepted:
              externalValue: './examples/valid/draft.accepted.json'
            repairAccepted:
              externalValue: './examples/valid/repair.accepted.json'
    ContractError:
      description: Contract or resource error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request does not satisfy the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidContract:
              externalValue: './examples/errors/400-invalid-contract.json'
    Conflict:
      description: The idempotency key is already bound to different request content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyConflict:
              externalValue: './examples/errors/409-idempotency-conflict.json'
    UnprocessableProvenance:
      description: The repair report contains non-MISSING findings or mismatched provenance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            provenanceMismatch:
              externalValue: './examples/errors/422-provenance-mismatch.json'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          enum:
            - CONTRACT_2001
            - BASELINE_2002
            - ENV_3001
            - ENV_3002
            - EXEC_4001
            - EXEC_4002
            - ANALYSIS_5001
            - REPAIR_6001
            - CANCELLED_7001
        message:
          type: string
          minLength: 1
        trace_id:
          type: string
          pattern: '^trace-[a-z0-9-]{3,64}$'
        field:
          type: string
          minLength: 1
